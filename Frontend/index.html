<!doctype html>
<html lang="en" data-theme="dark" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700;800&family=Montserrat:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Ledger, meters, and station operations for PetroBook."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PetroBook" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PetroBook</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('petrobook-theme')
          var theme =
            stored === 'orange' || stored === 'light' || stored === 'dark' ? stored : 'dark'
          if (!stored) localStorage.removeItem('theme')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          var colors = { orange: '#002d56', light: '#ffffff', dark: '#000000' }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', colors[theme] || colors.dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
